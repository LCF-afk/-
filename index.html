<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D立体菜园地块管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: system-ui, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; background: #87CEEB; }
    .panel-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
  </style>
</head>
<body class="bg-sky-100">
  <div id="canvas-container"></div>

  <div class="fixed top-4 left-4 right-4 z-10 bg-white/90 rounded-lg p-3 panel-shadow flex justify-between items-center">
    <h1 class="text-xl font-bold text-green-700">🥬 3D菜园地块管理</h1>
    <div class="flex gap-3">
      <button id="resetCameraBtn" class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">重置视角</button>
      <button id="resetSelectBtn" class="px-3 py-1 bg-gray-500 text-white rounded hover:bg-gray-600">取消选中</button>
    </div>
  </div>

  <div id="detailPanel" class="fixed bottom-4 left-4 w-80 bg-white rounded-lg p-4 panel-shadow hidden z-10">
    <h2 class="text-lg font-bold text-green-600 mb-3">地块信息编辑</h2>
    <input type="hidden" id="currentBlockId">
    <div class="mb-2">
      <label class="text-sm text-gray-600">地块名称</label>
      <input id="blockName" class="w-full border rounded px-2 py-1 mt-1" placeholder="例：一号菜地">
    </div>
    <div class="mb-2">
      <label class="text-sm text-gray-600">种植作物</label>
      <input id="blockCrop" class="w-full border rounded px-2 py-1 mt-1" placeholder="填写作物自动生成3D小草标识">
    </div>
    <div class="mb-2">
      <label class="text-sm text-gray-600">播种日期</label>
      <input type="date" id="blockDate" class="w-full border rounded px-2 py-1 mt-1">
    </div>
    <div class="mb-3">
      <label class="text-sm text-gray-600">备注</label>
      <textarea id="blockNote" class="w-full border rounded px-2 py-1 mt-1 h-20" placeholder="施肥、浇水记录..."></textarea>
    </div>
    <div class="flex gap-2">
      <button id="saveBlockBtn" class="flex-1 py-2 bg-green-500 text-white rounded hover:bg-green-600">保存</button>
      <button id="closePanelBtn" class="flex-1 py-2 bg-gray-300 rounded hover:bg-gray-400">关闭</button>
    </div>
  </div>

  <script>
    const GARDEN_CONFIG = {
      row: 6,
      col: 8,
      blockSize: 2,
      blockHeight: 0.3,
      gap: 0.2,
      selectOffset: 0.8,
      baseColor: 0x8b7355,
      selectColor: 0x4ade80
    }
    let scene, camera, renderer, controls, raycaster, mouse;
    let blockList = [];
    let selectBlock = null;
    let blockData = JSON.parse(localStorage.getItem('gardenData')) || {};

    // 纯3D生成小草幼苗模型（无图片，彻底解决跨域空白）
    function createPlantMesh() {
      const plantGroup = new THREE.Group();
      // 茎
      const stemGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.4, 6);
      const stemMat = new THREE.MeshLambertMaterial({ color: 0x2d882d });
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = 0.2;
      plantGroup.add(stem);
      // 两片叶子
      const leafGeo = new THREE.CylinderGeometry(0.02, 0.08, 0.25, 4);
      const leafMat = new THREE.MeshLambertMaterial({ color: 0x4fc14f });
      const leaf1 = new THREE.Mesh(leafGeo, leafMat);
      leaf1.position.set(-0.12, 0.35, 0);
      leaf1.rotation.z = Math.PI / 3;
      plantGroup.add(leaf1);
      const leaf2 = new THREE.Mesh(leafGeo, leafMat);
      leaf2.position.set(0.12, 0.35, 0);
      leaf2.rotation.z = -Math.PI / 3;
      plantGroup.add(leaf2);
      plantGroup.visible = false;
      return plantGroup;
    }

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      scene.fog = new THREE.Fog(0x87CEEB, 10, 40);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(12, 16, 14);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // 双层灯光，解决画面过暗空白
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 地面草坪
      const groundGeo = new THREE.PlaneGeometry(30, 30);
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x58a958 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      createGardenBlocks();
      initPlantIconState();

      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('click', onCanvasClick);
      animate();
    }

    function createGardenBlocks() {
      const { row, col, blockSize, blockHeight, gap, baseColor } = GARDEN_CONFIG;
      const totalWidth = col * blockSize + (col - 1) * gap;
      const totalDepth = row * blockSize + (row - 1) * gap;
      const startX = -totalWidth / 2 + blockSize / 2;
      const startZ = -totalDepth / 2 + blockSize / 2;

      for (let r = 0; r < row; r++) {
        for (let c = 0; c < col; c++) {
          const blockId = `block-${r}-${c}`;
          const geo = new THREE.BoxGeometry(blockSize, blockHeight, blockSize);
          const mat = new THREE.MeshLambertMaterial({ color: baseColor });
          const blockMesh = new THREE.Mesh(geo, mat);
          blockMesh.castShadow = true;
          const x = startX + c * (blockSize + gap);
          const z = startZ + r * (blockSize + gap);
          blockMesh.position.set(x, blockHeight / 2, z);
          
          const plant = createPlantMesh();
          plant.position.y = blockHeight;
          blockMesh.add(plant);

          blockMesh.userData = {
            id: blockId,
            originY: blockHeight / 2,
            plantMesh: plant
          };
          scene.add(blockMesh);
          blockList.push(blockMesh);
        }
      }
    }

    function initPlantIconState() {
      blockList.forEach(block => {
        const data = blockData[block.userData.id];
        if (data && data.crop && data.crop.trim() !== '') {
          block.userData.plantMesh.visible = true;
        }
      })
    }

    function onCanvasClick(event) {
      const canvas = renderer.domElement;
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(blockList);
      if (intersects.length > 0) {
        const targetBlock = intersects[0].object;
        selectSingleBlock(targetBlock);
      }
    }

    function selectSingleBlock(blockMesh) {
      if (selectBlock) resetBlockStyle(selectBlock);
      selectBlock = blockMesh;
      const { selectOffset, selectColor } = GARDEN_CONFIG;
      const userData = blockMesh.userData;
      blockMesh.position.y = userData.originY + selectOffset;
      blockMesh.scale.set(1.08, 1.08, 1.08);
      blockMesh.material.color.setHex(selectColor);
      userData.plantMesh.scale.set(1.2, 1.2, 1.2);
      openDetailPanel(userData.id);
    }

    function resetBlockStyle(blockMesh) {
      const userData = blockMesh.userData;
      blockMesh.position.y = userData.originY;
      blockMesh.scale.set(1, 1, 1);
      blockMesh.material.color.setHex(GARDEN_CONFIG.baseColor);
      userData.plantMesh.scale.set(1, 1, 1);
    }

    function clearAllSelect() {
      if (selectBlock) resetBlockStyle(selectBlock);
      selectBlock = null;
      document.getElementById('detailPanel').classList.add('hidden');
    }

    function openDetailPanel(blockId) {
      document.getElementById('currentBlockId').value = blockId;
      const data = blockData[blockId] || { name: '', crop: '', date: '', note: '' };
      document.getElementById('blockName').value = data.name;
      document.getElementById('blockCrop').value = data.crop;
      document.getElementById('blockDate').value = data.date;
      document.getElementById('blockNote').value = data.note;
      document.getElementById('detailPanel').classList.remove('hidden');
    }

    function saveBlockInfo() {
      const blockId = document.getElementById('currentBlockId').value;
      const cropVal = document.getElementById('blockCrop').value.trim();
      blockData[blockId] = {
        name: document.getElementById('blockName').value,
        crop: cropVal,
        date: document.getElementById('blockDate').value,
        note: document.getElementById('blockNote').value
      }
      localStorage.setItem('gardenData', JSON.stringify(blockData));
      selectBlock.userData.plantMesh.visible = cropVal !== '';
      alert('地块信息保存成功！');
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    document.getElementById('resetCameraBtn').addEventListener('click', () => {
      camera.position.set(12, 16, 14);
      controls.reset();
    })
    document.getElementById('resetSelectBtn').addEventListener('click', clearAllSelect);
    document.getElementById('closePanelBtn').addEventListener('click', () => {
      document.getElementById('detailPanel').classList.add('hidden');
    })
    document.getElementById('saveBlockBtn').addEventListener('click', saveBlockInfo);

    initThree();
  </script>
</body>
</html>
